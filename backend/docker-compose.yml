services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lenspilot-postgres
    environment:
      POSTGRES_DB: lenspilot_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenspilot_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

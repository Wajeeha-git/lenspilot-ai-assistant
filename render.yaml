services:
  - type: web
    name: lenspilot-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lenspilot-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '*'

databases:
  - name: lenspilot-db
    plan: free
    postgresMajorVersion: 15
    extensions:
      - pgvector

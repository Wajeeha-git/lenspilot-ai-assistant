services:
  - type: web
    name: lenspilot-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lenspilot-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://lenspilot-backend.onrender.com

databases:
  - name: lenspilot-db
    plan: free
    postgresMajorVersion: 15
